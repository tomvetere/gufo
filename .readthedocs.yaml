version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Docs dependencies live in a PEP 735 dependency-group, which pip's
    # extra_requirements cannot resolve. Install the group explicitly.
    post_install:
      - python -m pip install --group docs
    pre_build:
      - python docs/_scripts/generate_gallery.py

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - all
